<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-перекладач емоцій</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: #667eea; }
        button {
            margin-top: 15px;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #5568d3; }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            text-align: left;
        }
        .emoji { font-size: 42px; text-align: center; margin-bottom: 10px; }
        .emotion-title { font-size: 20px; font-weight: bold; color: #222; text-align: center; }
        .confidence { font-size: 12px; color: #888; text-align: center; margin-bottom: 12px; }
        .advice { font-size: 15px; color: #444; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎭 AI-перекладач емоцій</h1>
        <p class="subtitle">Введіть речення англійською мовою, і ML-модель визначить емоцію та дасть пораду</p>
        
        <form method="POST">
            <textarea name="user_text" placeholder="Наприклад: I am so happy today because I passed my exam! або I feel really sad and tired..." required>{{ user_text }}</textarea>
            <button type="submit">Визначити емоцію</button>
        </form>

        {% if result %}
        <div class="result-box">
            <div class="emoji">{{ result.emoji }}</div>
            <div class="emotion-title">{{ result.emotion }}</div>
            <div class="confidence">Впевненість моделі: {{ result.confidence }}%</div>
            <div class="advice">💡 <b>Порада від ШІ:</b> {{ result.advice }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
